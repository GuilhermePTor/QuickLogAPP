<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Log</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#2563eb;--bd:#d9dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#e8ebef;--mu:#98a1ad;--ac:#6ea0ff;--bd:#323a45}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:12px;max-width:560px;margin:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px}.row>div{flex:1}
.btn{width:100%;padding:12px;margin-top:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.item span{color:var(--mu)}.item b{font-weight:600}.x{border:0;background:none;color:#dc2626;font-size:18px}
textarea.out{height:110px;font-size:12px;margin-top:8px}.msg{color:var(--mu);font-size:13px;min-height:18px;margin-top:6px}
</style></head><body>
<div class="tabs" id="tabs"></div>
<div class="card"><div id="form"></div><button class="btn" id="save">Save entry</button></div>
<div class="card"><b id="lt"></b>
<label>Last ID number already in my Excel (e.g. 45 for EXP-0045)</label><input id="base" type="number" inputmode="numeric" placeholder="0">
<button class="btn s" id="copyNew">Copy new rows for Excel</button>
<button class="btn s" id="copyAll">Copy all rows (with header)</button>
<textarea class="out" id="out" hidden readonly></textarea><div class="msg" id="msg"></div>
<div id="list"></div></div>
<script>
const today=()=>new Date().toISOString().slice(0,10);
const nowT=()=>new Date().toTimeString().slice(0,5);
const D={
exp:{label:'Expenses',id:'Expense ID',pre:'EXP-',pad:4,auto:'Item',show:['Date','Item','Total Price (€)'],f:[
{n:'Date',t:'date',d:today},{n:'Item',l:1,af:1},{n:'Category',l:1,af:1},{n:'Subcategory',l:1,af:1},
{n:'Quantity',t:'number',step:'any',half:1},{n:'Unit',o:['kg','g','l','ml','unit','pack'],af:1,half:1},
{n:'Unit Price (€)',t:'number',step:'any',af:1,half:1},{n:'Total Price (€)',t:'number',step:'any',calc:r=>r['Quantity']&&r['Unit Price (€)']?+(r['Quantity']*r['Unit Price (€)']).toFixed(5):'',half:1},
{n:'Store / Provider',l:1,af:1},{n:'Notes',t:'area'},{n:'event_id',t:'number'}]},
tr:{label:'Training',id:'Session ID',pre:'TR',pad:3,auto:'Activity',show:['Date','Activity','Duration (min)'],f:[
{n:'Date',t:'date',d:today},{n:'Activity',l:1,af:1},{n:'Start Time',t:'time',af:1,half:1},{n:'End Time',t:'time',d:nowT,half:1},
{n:'Duration (min)',t:'number',calc:r=>{if(!r['Start Time']||!r['End Time'])return'';let a=r['Start Time'].split(':'),b=r['End Time'].split(':');let m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);return m<0?m+1440:m}},
{n:'Notes',t:'area'},{n:'event_id',t:'number'}]},
ln:{label:'Learning',id:'Session ID',pre:'LS',pad:3,auto:'Learning Material',show:['Date','Learning Material','Duration (min)'],f:[
{n:'Date',t:'date',d:today},{n:'Learning Material',l:1,af:1},{n:'Type',o:['Course','Book','Video','Article','Docs','Practice'],af:1,half:1},{n:'Platform',l:1,af:1,half:1},
{n:'Duration (min)',t:'number',half:1},{n:'Last Page',t:'number',half:1},{n:'Last Section Completed',l:1},{n:'event_id',t:'number'}]},
jb:{label:'Jobs',id:'Application ID',pre:'APP-',pad:4,auto:'Company',show:['Company','Job Title','Status'],f:[
{n:'Company',l:1},{n:'Job Title',l:1},{n:'Work Type',o:['Remote','Hybrid','On-site'],d:()=>'Remote',half:1},{n:'Location',l:1,half:1},
{n:'Application Method',o:['Easy Apply','Company site','Email','Referral'],d:()=>'Easy Apply',half:1},{n:'Platform',o:['Linkedin','Indeed','Company site','Other'],d:()=>'Linkedin',half:1},
{n:'Application Date',t:'date',d:today,half:1},{n:'First Response Date',t:'date',half:1},{n:'Job Link',t:'url'},
{n:'Status',o:['Applied','Screening','Interview','Offer','Rejected','Ghosted'],d:()=>'Applied'},
{n:'Last_Synced_At',t:'date'},{n:'CV Version',l:1,af:1},{n:'event_id',t:'number'}]}};
let cur='exp',rows={},sent={},base={};
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
for(const k in D){rows[k]=ld('ql_'+k)||[];sent[k]=ld('qs_'+k)||0;base[k]=ld('qb_'+k)||0}
const cols=k=>{const D0=D[k];const c=[D0.id];D0.f.forEach(f=>c.push(f.n));return c};
const $=id=>document.getElementById(id);
function fmt(v,f){if(!v)return'';if(f.t==='date'){const[y,m,d]=v.split('-');return d+'/'+m+'/'+y}return v}
function tabs(){$('tabs').innerHTML='';for(const k in D){const b=document.createElement('button');b.textContent=D[k].label;b.className=k===cur?'on':'';b.onclick=()=>{cur=k;draw()};$('tabs').appendChild(b)}}
function draw(){tabs();const d=D[cur];let h='',open=false;
d.f.forEach((f,i)=>{if(f.half&&!open){h+='<div class="row">';open=true}
if(!f.half&&open){h+='</div>';open=false}
h+=(f.half?'<div>':'')+'<label>'+f.n+'</label>';
const id='f'+i,v=f.d?f.d():'';
if(f.o)h+='<select id="'+id+'"><option value=""></option>'+f.o.map(o=>'<option'+(o===v?' selected':'')+'>'+o+'</option>').join('')+'</select>';
else if(f.t==='area')h+='<textarea id="'+id+'" rows="2"></textarea>';
else h+='<input id="'+id+'" type="'+(f.t||'text')+'"'+(f.step?' step="any"':'')+(f.t==='number'?' inputmode="decimal"':'')+(f.l?' list="dl'+i+'"':'')+(f.calc?' readonly placeholder="auto"':'')+' value="'+v+'">'+(f.l?'<datalist id="dl'+i+'">'+[...new Set(rows[cur].map(r=>r[f.n]).filter(Boolean))].map(x=>'<option value="'+String(x).replace(/"/g,'&quot;')+'">').join('')+'</datalist>':'');
h+=f.half?'</div>':'';
if(f.half&&i===d.f.length-1&&open){h+='</div>';open=false}});
if(open)h+='</div>';$('form').innerHTML=h;
d.f.forEach((f,i)=>{const e=$('f'+i);e.addEventListener('input',recalc);if(f.n===d.auto)e.addEventListener('change',autofill)});
list();$('base').value=base[cur]||'';$('msg').textContent='';$('out').hidden=true}
$('base').oninput=()=>{base[cur]=parseInt($('base').value,10)||0;sv('qb_'+cur,base[cur])};
function read(){const r={};D[cur].f.forEach((f,i)=>r[f.n]=$('f'+i).value);return r}
function recalc(){const r=read();D[cur].f.forEach((f,i)=>{if(f.calc)$('f'+i).value=f.calc(r)})}
function autofill(){const d=D[cur],key=$('f'+d.f.findIndex(f=>f.n===d.auto)).value;
const last=[...rows[cur]].reverse().find(r=>r[d.auto]===key);if(!last)return;
d.f.forEach((f,i)=>{if(f.af&&f.n!==d.auto&&!$('f'+i).value)$('f'+i).value=last[f.n]||''});recalc()}
function nextId(){const d=D[cur];let n=base[cur]||0;rows[cur].forEach(r=>{const m=parseInt(String(r[d.id]).slice(d.pre.length),10);if(m>n)n=m});return d.pre+String(n+1).padStart(d.pad,'0')}
$('save').onclick=()=>{const d=D[cur];recalc();const r=read();
if(!r[d.auto]){$('msg').textContent='Fill in: '+d.auto;return}
r[d.id]=nextId();rows[cur].push(r);sv('ql_'+cur,rows[cur]);draw();$('msg').textContent='Saved '+r[d.id]};
function list(){const d=D[cur];$('lt').textContent=d.label+' – '+rows[cur].length+' entries ('+(rows[cur].length-sent[cur])+' not copied yet)';
$('list').innerHTML='';[...rows[cur]].reverse().slice(0,15).forEach(r=>{const el=document.createElement('div');el.className='item';
el.innerHTML='<div><b>'+r[d.id]+'</b> <span>'+d.show.map(s=>r[s]||'').join(' · ')+'</span></div>';
const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=()=>{rows[cur]=rows[cur].filter(q=>q!==r);sent[cur]=Math.min(sent[cur],rows[cur].length);sv('ql_'+cur,rows[cur]);sv('qs_'+cur,sent[cur]);list()};
el.appendChild(x);$('list').appendChild(el)})}
function tsv(rs,head){const d=D[cur];const fs=d.f;const lines=rs.map(r=>[r[d.id]].concat(fs.map(f=>String(fmt(r[f.n],f)).replace(/[\t\n\r]+/g,' '))).join('\t'));
return(head?[cols(cur).join('\t')]:[]).concat(lines).join('\n')}
async function out(text,markSent){const o=$('out');o.value=text;o.hidden=false;let ok=false;
try{await navigator.clipboard.writeText(text);ok=true}catch(e){o.select();try{ok=document.execCommand('copy')}catch(e2){}}
$('msg').textContent=ok?'Copied – paste into Excel (A-column, first empty row).':'Select the text above and copy it manually.';
if(markSent){sent[cur]=rows[cur].length;sv('qs_'+cur,sent[cur]);list()}}
$('copyNew').onclick=()=>{const rs=rows[cur].slice(sent[cur]);if(!rs.length){$('msg').textContent='Nothing new.';return}out(tsv(rs,false),true)};
$('copyAll').onclick=()=>out(tsv(rows[cur],true),false);
draw();
</script></body></html>
